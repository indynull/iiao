name = "algor-iiao"
main = "worker/index.ts"
compatibility_date = "2026-08-05"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Free tier: 10k Neurons/day on Workers Free (no external API key)
[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1

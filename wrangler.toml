name = "algor-iiao"
main = "worker/index.ts"
compatibility_date = "2026-08-05"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker handles API + permalink OG inject before static assets
run_worker_first = true

# Free tier: 10k Neurons/day on Workers Free (no external API key)
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "TELEMETRY"
id = "81a4030fc28e46fbaee9898beff60c71"
preview_id = "96b43e6593a546e8a8fa035ad5529f1b"

# Optional secret TELEMETRY_TOKEN for /api/telemetry
#   npx wrangler secret put TELEMETRY_TOKEN

[observability]
enabled = true
head_sampling_rate = 1
